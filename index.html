<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Practice</title>
    <!-- External -->
    <link href="style.css" rel="stylesheet" />

    <!-- Internal Style -->
    <!-- <style>
        h1 {
            color: green
        }
    </style> -->
</head>

<body>
    <!-- Inline Style -->
    <h1>Welcome To CSS</h1>

    <p>This is a paragraph styled with an element selector</p>

    <h2>Random Heading</h2>
    <!-- ID And Class Selectors -->
    <h3 id="special-heading">I have a unique ID</h3>
    <p class="highlight">This is a paragraph has a <span>class</span></p>
    <p class="highlight">This is another Element using the <span>same</span>class</p>

    <!-- Group Selectors -->
    <h3>Group Selector</h3>
    <p>Selectors let us reuse multiple elements</p>

    <ul id="colors">
        <li>Red <span>Purple</span></li>
        <li>Orange <span>Green</span></li>
        <li>Blue <span>Violet</span> </li>
    </ul>


</body>

</html>
